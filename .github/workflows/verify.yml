name: Lab06 PICT verification

on:
  push:
    branches: [main]
    paths:
      - 'browser.model'
      - 'transfer-nc.model'
      - 'transfer.model'
      - 'transfer-neg.model'
      - 'scripts/**'
      - '.github/workflows/verify.yml'
  workflow_dispatch:

concurrency:
  group: lab06-pict-main
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  pict:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install PICT build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git cmake g++ make python3

      - name: Build Microsoft PICT and generate all models
        run: bash scripts/verify-lab.sh

      - name: Finalize report using actual generated results
        run: python3 scripts/finalize-readme.py

      - name: Commit real PICT evidence
        if: success()
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout origin/main -- README.md
          python3 scripts/finalize-readme.py
          git add README.md results/
          if ! git diff --cached --quiet; then
            git commit -m "test: record reproducible PICT build and covering arrays"
            git push origin HEAD:main
          fi

      - name: Upload PICT build and model outputs even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lab06-pict-results
          path: results/
          if-no-files-found: warn
          retention-days: 30
